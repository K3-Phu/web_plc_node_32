<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLC Monitoring Dashboard</title>
    <link rel="icon" href="data:,">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #263445;
        }

        header {
            background: #172337;
            color: white;
            padding: 22px 30px;
        }

        header h2 {
            font-size: 22px;
        }

        header p {
            color: #aab8cc;
            font-size: 13px;
            margin-top: 6px;
        }

        .container {
            padding: 30px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .connection {
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            background: #eee;
        }

        .connected {
            background: #dcfce7;
            color: #15803d;
        }

        .disconnected {
            background: #fee2e2;
            color: #dc2626;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 2px 5px rgba(0, 0, 0, .03);
        }

        .card h3 {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 18px;
            font-weight: 500;
            overflow-wrap: anywhere;
        }

        .value {
            font-size: 32px;
            font-weight: bold;
            color: #172337;
            overflow-wrap: anywhere;
        }

        .footer {
            margin-top: 25px;
            color: #94a3b8;
            font-size: 12px;
        }

        .empty {
            grid-column: 1 / -1;
            color: #64748b;
            background: white;
            padding: 24px;
            border-radius: 12px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 18px;
            }

            header {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>PLC Monitoring Dashboard</h2>
        <p>Real-time PLC I/O Monitoring System</p>
    </header>

    <main class="container">

        <div class="top-bar">
            <h3>PLC-IO Monitoring</h3>
            <div id="connection" class="connection disconnected">
                Connecting...
            </div>
        </div>

        <section id="dashboard" class="grid">
            <div class="empty">กำลังโหลดข้อมูล...</div>
        </section>

        <div class="footer">
            Last Update: <span id="last-update">--</span>
        </div>

    </main>

    <script type="module">

        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

        import {
            getDatabase,
            ref,
            onValue
        } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";


        // ========================================
        // FIREBASE CONFIGURATION
        // ========================================

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "plc-connectwith-esp32.firebaseapp.com",

            // แก้ URL ให้ตรงกับ Realtime Database ของคุณ
            databaseURL: "https://plc-connectwith-esp32-default-rtdb.asia-southeast1.firebasedatabase.app",

            projectId: "plc-connectwith-esp32",
            storageBucket: "plc-connectwith-esp32.firebasestorage.app",
            messagingSenderId: "1007351984981",
            appId: "1:1007351984981:web:e237b433e2e44e1810f5dc"
        };


        // ========================================
        // DOM ELEMENTS
        // ========================================

        const dashboard = document.getElementById("dashboard");
        const connection = document.getElementById("connection");
        const lastUpdate = document.getElementById("last-update");


        // ========================================
        // CONNECTION STATUS
        // ========================================

        function setConnection(status, message) {

            connection.textContent = message;

            connection.className = "connection " +
                (status ? "connected" : "disconnected");

        }


        // ========================================
        // EMPTY MESSAGE
        // ========================================

        function showMessage(message) {

            dashboard.replaceChildren();

            const element = document.createElement("div");

            element.className = "empty";
            element.textContent = message;

            dashboard.appendChild(element);

        }


        // ========================================
        // RENDER DASHBOARD
        // ========================================

        function renderDashboard(data) {

            dashboard.replaceChildren();

            if (!data || typeof data !== "object") {

                showMessage("ยังไม่มีข้อมูลใน PLC-IO");

                return;

            }

            Object.entries(data).forEach(([key, value]) => {

                const card = document.createElement("article");
                card.className = "card";

                const title = document.createElement("h3");
                title.textContent = key;

                const display = document.createElement("div");
                display.className = "value";

                if (typeof value === "boolean") {

                    display.textContent = value ? "ON" : "OFF";

                } else if (value === null || value === undefined) {

                    display.textContent = "--";

                } else if (typeof value === "object") {

                    display.textContent = JSON.stringify(value);

                } else {

                    display.textContent = String(value);

                }

                card.append(title, display);

                dashboard.appendChild(card);

            });

            lastUpdate.textContent = new Date().toLocaleString();

        }


        // ========================================
        // INITIALIZE FIREBASE
        // ========================================

        try {

            if (!firebaseConfig.databaseURL) {
                throw new Error("กรุณากำหนด Firebase Database URL");
            }

            const app = initializeApp(firebaseConfig);

            const database = getDatabase(app);


            // ------------------------------------
            // CHECK CONNECTION
            // ------------------------------------

            const connectedRef = ref(database, ".info/connected");

            onValue(connectedRef, (snapshot) => {

                const connected = snapshot.val() === true;

                if (connected) {

                    setConnection(true, "Connected");

                } else {

                    setConnection(false, "Disconnected");

                }

            });


            // ------------------------------------
            // READ PLC DATA
            // ------------------------------------

            const plcRef = ref(database, "PLC-IO");

            onValue(

                plcRef,

                (snapshot) => {

                    const data = snapshot.val();

                    renderDashboard(data);

                },

                (error) => {

                    console.error("Firebase Read Error:", error);

                    setConnection(false, "Read Error");

                    showMessage("ไม่สามารถอ่านข้อมูล PLC-IO ได้");

                }

            );


            console.log("Firebase Initialized Successfully");


        } catch (error) {

            console.error("Firebase Initialization Error:", error);

            setConnection(false, "Setup Error");

            showMessage(error.message);

        }

    </script>

</body>

</html>
